name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows 是 issue #1 的现场平台，必须有一条真跑的流水线，而不是靠「预期可用」。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 版本由 package.json 的 packageManager 字段决定，避免两处漂移
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run roster:check
      - run: pnpm run examples:check
      - run: pnpm test
      # prepack 会再跑一遍 check，这里只要清单，不重复跑测试
      - run: npm pack --dry-run --ignore-scripts
